# Companies whose public job boards we scan every day.
# To follow a new company: open its careers page, see which platform hosts the jobs
# (the apply link usually shows it), and add the board name under that platform.
#   greenhouse:      boards.greenhouse.io/<board>  or  job-boards.greenhouse.io/<board>
#   ashby:           jobs.ashbyhq.com/<board>
#   lever:           jobs.lever.co/<board>
#   smartrecruiters: jobs.smartrecruiters.com/<board>
#   personio:        <board>.jobs.personio.de
#   recruitee:       <board>.recruitee.com
# Options: lever `region: eu` (jobs.eu.lever.co); personio `domain: jobs.personio.com`,
# `languages: [de, en]` (one feed per language, merged by job id).
#   teamtailor:      <board>.teamtailor.com, or the careers host itself (e.g. careers.example.de)

aggregators:
  arbeitnow: true
  bundesagentur: true

# Bundesagentur für Arbeit: each search term returns up to max_per_query roles in Germany
# published in the last `days` days. Broad terms ("Software", "KI") return tens of thousands.
bundesagentur:
  days: 30
  max_per_query: 500
  queries:
    - Data Scientist
    - Data Engineer
    - Data Analyst
    - Machine Learning
    - Python
    - Software Engineer
    - Softwareentwickler
    - Frontend
    - Backend
    - DevOps
    - Cloud Engineer
    - Bioinformatik
    - Werkstudent Informatik
    - Werkstudent Data
    - Praktikum Informatik
    - Abschlussarbeit Informatik

