# Companies whose public job boards we scan every day.
# To follow a new company: open its careers page, see which platform hosts the jobs
# (the apply link usually shows it), and add the board name under that platform.
#   greenhouse:      boards.greenhouse.io/<board>  or  job-boards.greenhouse.io/<board>
#   ashby:           jobs.ashbyhq.com/<board>
#   lever:           jobs.lever.co/<board>
#   smartrecruiters: jobs.smartrecruiters.com/<board>
#   personio:        <board>.jobs.personio.de

